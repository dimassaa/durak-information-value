[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durak-study"
version = "0.1.0"
description = "Deterministic Durak simulation and the price-of-information study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.0"]

[tool.setuptools]
packages = ["durak", "durak.strategies", "analysis", "reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "perf: throughput and cost benchmarks; excluded from the default run",
]
# The perf marker is excluded by default so a routine `pytest` is a correctness
# signal only. Timing numbers are collected deliberately via `pytest -m perf`,
# because wall-clock thresholds on shared hardware fail for reasons unrelated to
# the code under test.
#
# `-n auto` runs the suite across cores by default: 87% of it is three long tests, so serial
# execution made an edit-check cycle cost minutes. Pass `-n 0` for serial when a failure looks
# order-dependent, or `--lf` to re-run only what last failed.
addopts = "-m 'not perf' --strict-markers -q -n auto"

# Numba cannot cache any function that touches the `GameState` jitclass ("dynamic globals"), so
# a cold run pays ~12 s of compilation for the engine chain. That warning is emitted once per
# function, which drowns the actual test output; it is not actionable from here, and the
# `.gitignore` covers the cache files it does manage to write.
filterwarnings = [
    "ignore:Cannot cache compiled function:Warning",
]